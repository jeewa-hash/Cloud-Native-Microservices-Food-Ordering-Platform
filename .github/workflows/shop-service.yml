name: Shop Management Service CI/CD

on:
  push:
    # ShopManagementService ෆෝල්ඩරය තුළ වෙනසක් සිදු වූ විට පමණක් ක්‍රියාත්මක වේ
    paths:
      - 'ShopManagementService/**'
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      # 1. GitHub Repository එකෙන් Code එක ලබා ගැනීම
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Snyk Security Scan (SAST Integration) - ලකුණු 20% සඳහා [cite: 39, 63]
      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/node@master
        continue-on-error: true # ආරක්ෂක දෝෂ තිබුණත් පයිප්ලය නතර නොවී පවත්වා ගැනීමට
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN_SHOP_MANAGEMENT }}
        with:
          # directory වෙනුවට args හරහා package.json ඇති තැන පෙන්වීමෙන් දෝෂය විසඳේ
          args: --severity-threshold=high --pkg-manager=npm --file=ShopManagementService/package.json

      # 3. Docker Hub වෙත ලොග් වීම
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME_SHOP_MANAGEMENT }}
          password: ${{ secrets.DOCKER_PASSWORD_SHOP_MANAGEMENT }}

      # 4. Docker Image එක build කරලා Push කිරීම [cite: 24, 27]
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          # Dockerfile එක ඇති තැන නිවැරදිව ලබා දී ඇත
          context: ./ShopManagementService
          push: true
          tags: ${{ secrets.DOCKER_USERNAME_SHOP_MANAGEMENT }}/shop-management-service:latest