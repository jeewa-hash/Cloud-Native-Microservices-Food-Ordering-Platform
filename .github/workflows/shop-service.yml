name: Shop Management Service CI/CD

on:
  push:
    paths:
      - 'ShopManagementService/**'
    branches: [ "main" ]

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install Dependencies
        run: npm ci
        working-directory: ./ShopManagementService

      # Snyk Scan - Working Directory එක Set කරලා
      - name: Run Snyk
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN_SHOP_MANAGEMENT }}
        with:
          args: --severity-threshold=high
        working-directory: ./ShopManagementService  # **මෙය වැදගත්**
        continue-on-error: true

  build-and-push:
    needs: security-scan
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME_SHOP_MANAGEMENT }}
          password: ${{ secrets.DOCKER_PASSWORD_SHOP_MANAGEMENT }}
          
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./ShopManagementService
          push: true
          tags: ${{ secrets.DOCKER_USERNAME_SHOP_MANAGEMENT }}/shop-management-service:latest