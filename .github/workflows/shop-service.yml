name: Shop Management Service CI/CD

on:
  push:
    paths:
      - 'ShopManagementService/**'
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: |
          cd ShopManagementService
          npm ci
      - name: Run tests
        run: |
          cd ShopManagementService
          npm test
        env:
          NODE_ENV: test

  build-and-push:
    needs: test  # test success වුනාට පස්සේ build කරන්න
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME_SHOP_MANAGEMENT }}
          password: ${{ secrets.DOCKER_PASSWORD_SHOP_MANAGEMENT }}
      - uses: docker/build-push-action@v6
        with:
          context: ./ShopManagementService
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME_SHOP_MANAGEMENT }}/shop-management-service:latest
            ${{ secrets.DOCKER_USERNAME_SHOP_MANAGEMENT }}/shop-management-service:${{ github.sha }}