name: Shop Management Service CI/CD

on:
  push:
    paths:
      - 'ShopManagementService/**'
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      # 1. GitHub Repository එකෙන් Code එක ලබා ගැනීම
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Node.js පරිසරය සකස් කිරීම
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      # 3. Dependencies Install කිරීම (මෙය අත්‍යවශ්‍යයි Snyk සඳහා)
      - name: Install Dependencies
        run: npm install
        working-directory: ./ShopManagementService

      # 4. Snyk Security Scan (SAST Integration) - ලකුණු 20% සඳහා 
      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN_SHOP_MANAGEMENT }}
        with:
          args: --severity-threshold=high --pkg-manager=npm --file=ShopManagementService/package.json

      # 5. Docker Hub වෙත ලොග් වීම
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME_SHOP_MANAGEMENT }}
          password: ${{ secrets.DOCKER_PASSWORD_SHOP_MANAGEMENT }}

      # 6. Docker Image එක build කරලා Push කිරීම [cite: 24, 27]
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./ShopManagementService
          push: true
          tags: ${{ secrets.DOCKER_USERNAME_SHOP_MANAGEMENT }}/shop-management-service:latest