name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ] # 'main' branch එකට code එක push කරන විට මෙය ක්‍රියාත්මක වේ

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. GitHub එකේ තියෙන code එක ලබා ගැනීම
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Docker Hub වෙත ලොග් වීම (Using Secrets) [cite: 37]
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 3. Docker Image එක build කරලා Docker Hub එකට push කිරීම [cite: 50]
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/shop-management-service:latest